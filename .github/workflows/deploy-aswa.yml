name: Deploy Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aswa-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Validate frontend
        run: |
          npm audit --include=dev --audit-level=low
          npm run lint

      - name: Validate VITE_DATA_API_BASE
        env:
          VITE_DATA_API_BASE: ${{ vars.VITE_DATA_API_BASE }}
        run: |
          if [ -z "$VITE_DATA_API_BASE" ]; then
            echo "::error::VITE_DATA_API_BASE repository variable must be set before deploying (e.g. https://ca-aguadapraia-api-prod.azurecontainerapps.io/api/data)"
            exit 1
          fi

      - name: Validate API compatibility
        env:
          VITE_DATA_API_BASE: ${{ vars.VITE_DATA_API_BASE }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            "${VITE_DATA_API_BASE%/}/evolution/index" \
            --output evolution-index.json
          node -e "const data = require('./evolution-index.json'); if (data.schemaVersion !== 1 || !Array.isArray(data.dates)) process.exit(1)"

      - name: Build frontend
        env:
          # Full Container Apps API base URL — set as repository variable
          VITE_DATA_API_BASE: ${{ vars.VITE_DATA_API_BASE }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: npm run build:local

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
